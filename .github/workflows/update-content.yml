name: Update daily content

on:
  schedule:
    # 每天北京时间 01:20（UTC 17:20）运行
    - cron: '20 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest content
        run: node scripts/auto-update.mjs
        env:
          MEMENE_API_KEY: ${{ secrets.MEMENE_API_KEY }}
          MEMENE_USER_ID: ${{ secrets.MEMENE_USER_ID }}
          MEMENE_PLAN_ID: ${{ secrets.MEMENE_PLAN_ID }}
          MEMENE_PLAN_NAME: ${{ secrets.MEMENE_PLAN_NAME }}
          FETCH_LIMIT: ${{ secrets.FETCH_LIMIT }}
          UPDATE_LOG_PATH: ${{ runner.temp }}/auto-update.log

      - name: Commit updated content
        run: |
          if git diff --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/dailies.ts src/data/weibos.ts
          git commit -m "chore: update daily content"
          git push
